<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人作品集入口 | Portfolio Index</title>
    <style>
        /* === 全局樣式重置與背景設計 === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1026;
            background-image: 
                radial-gradient(at 20% 20%, rgba(118, 75, 162, 0.25) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(102, 126, 234, 0.25) 0px, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* === 主容器 === */
        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        /* === 個人頭像與資訊區域 === */
        .profile-section {
            margin-bottom: 40px;
        }

        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            box-shadow: 0 0 25px rgba(102, 126, 234, 0.6);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .avatar-container:hover .avatar {
            transform: scale(1.08) rotate(3deg);
            box-shadow: 0 0 35px rgba(118, 75, 162, 0.9);
        }

        .user-name {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1rem;
            color: #8a99ad;
            letter-spacing: 1px;
        }

        /* === 按鈕網格區域 (Grid) === */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 電腦版每行 4 個 */
            gap: 20px;
            margin-top: 20px;
        }

        /* 響應式微調 */
        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr); /* 平板每行 2 個 */
            }
        }

        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: repeat(1, 1fr); /* 手機版每行 1 個 */
            }
            .user-name {
                font-size: 1.6rem;
            }
        }

        /* === 按鈕基礎通用樣式 === */
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* === 1. 已解鎖按鈕樣式 === */
        .btn-unlocked {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            border: 1.5px solid rgba(102, 126, 234, 0.4);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* 解鎖按鈕懸停（Hover）特效 */
        .btn-unlocked:hover {
            transform: translateY(-5px) scale(1.02);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            border-color: #a1c4fd;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4),
                        0 0 15px rgba(161, 196, 253, 0.3);
            color: #ffffff;
        }

        /* 按鈕內的動態光芒邊條 */
        .btn-unlocked::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn-unlocked:hover::before {
            left: 100%;
        }

        .badge-open {
            font-size: 0.85rem;
            background: rgba(102, 126, 234, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            color: #a1c4fd;
        }

        /* === 2. 未解鎖按鈕樣式 === */
        .btn-locked {
            background: rgba(255, 255, 255, 0.02);
            color: #5a6578;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            user-select: none;
        }

        .btn-locked:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
            color: #7a8a9e;
        }

        .lock-icon {
            font-size: 1.1rem;
            opacity: 0.6;
            filter: grayscale(100%);
        }
    </style>
</head>
